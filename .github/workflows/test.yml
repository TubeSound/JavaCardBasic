name: Java Card lesson checks

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test the APDU contract
        run: ./mvnw --batch-mode --no-transfer-progress test
      - name: Run the first lesson
        run: ./mvnw --batch-mode --no-transfer-progress -q compile exec:java
